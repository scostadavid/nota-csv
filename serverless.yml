# org: scostadavid
# app: nfe-app
service: nfe

plugins:
  - serverless-offline
  - serverless-localstack

custom:
  dotenv:
    path: .env
  # Only redirects to LocalStack when deploying with `--stage local`.
  localstack:
    stages:
      - local

provider:
  name: aws
  runtime: nodejs20.x
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - x-api-key
      allowedMethods:
        - POST
        - OPTIONS
  environment:
    INCOMING_BUCKET: incoming-xml-bucket-${sls:stage}-nfe
    PROCESSED_BUCKET: processed-csv-bucket-${sls:stage}-nfe
    TABLE_NAME: processing-status-table-${sls:stage}-nfe
    API_KEYS_TABLE: api-keys-table-${sls:stage}-nfe
    USAGE_TABLE: usage-table-${sls:stage}-nfe
    MONTHLY_LIMIT: '100'
    FROM_EMAIL: ${env:FROM_EMAIL, 'me@scostadavid.dev'}
    QUEUE_URL:
      Ref: ProcessingQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - !Sub arn:aws:s3:::incoming-xml-bucket-${sls:stage}-nfe
            - !Sub arn:aws:s3:::incoming-xml-bucket-${sls:stage}-nfe/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - !Sub arn:aws:s3:::processed-csv-bucket-${sls:stage}-nfe
            - !Sub arn:aws:s3:::processed-csv-bucket-${sls:stage}-nfe/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [ProcessingQueue, Arn]
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt: [ProcessingStatusTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - Fn::GetAtt: [ApiKeysTable, Arn]
            - !Sub '${ApiKeysTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt: [UsageTable, Arn]
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource:
            - '*'

functions:
  upload:
    handler: handlers/uploadNfeBatch.handler
    timeout: 20
    memorySize: 512
    events:
      - httpApi:
          path: /upload
          method: post

  signup:
    handler: handlers/signup.handler
    events:
      - httpApi:
          path: /signup
          method: post

  processQueue:
    handler: handlers/processQueue.handler
    timeout: 30
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ProcessingQueue
              - Arn

resources:
  Resources:
    IncomingBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: incoming-xml-bucket-${sls:stage}-nfe

    ProcessedBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: processed-csv-bucket-${sls:stage}-nfe

    ProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: xml-processing-queue

    ProcessingStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: processing-status-table-${sls:stage}-nfe
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: email
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    ApiKeysTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: api-keys-table-${sls:stage}-nfe
        AttributeDefinitions:
          - AttributeName: apiKey
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: apiKey
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        BillingMode: PAY_PER_REQUEST

    UsageTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: usage-table-${sls:stage}-nfe
        AttributeDefinitions:
          - AttributeName: apiKey
            AttributeType: S
          - AttributeName: windowKey
            AttributeType: S
        KeySchema:
          - AttributeName: apiKey
            KeyType: HASH
          - AttributeName: windowKey
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        BillingMode: PAY_PER_REQUEST
