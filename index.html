<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotaCSV – Converta XML em CSV</title>
  <meta name="description" content="Transforme arquivos XML de NFS-e em planilhas CSV automaticamente. Envio simples, recebimento rápido por e-mail.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-bubbles {
      background: radial-gradient(circle at 10% 20%, rgba(99,102,241,0.1) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(99,102,241,0.05) 0%, transparent 50%);
    }
  </style>
</head>
<body class="bg-gray-50 bg-bubbles text-gray-800 min-h-screen flex flex-col">

  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">

      <!-- Signup: get an API key -->
      <div id="signupSection">
        <form id="signupForm" class="space-y-4">
          <div>
            <label for="signupEmail" class="block text-sm font-medium">Seu e-mail</label>
            <input type="email" id="signupEmail" name="signupEmail" required placeholder="seumelhoremail@provedor.com"
              class="mt-1 w-full text-sm border border-gray-300 rounded-lg p-2 bg-white" />
          </div>
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg shadow transition">
            Gerar chave
          </button>
        </form>
        <div id="signupMessage" class="text-sm text-center mt-4"></div>
      </div>

      <!-- Upload: send XML files -->
      <div id="uploadSection" class="hidden">
        <p class="text-xs font-mono text-gray-700 break-all bg-gray-100 rounded p-2 mb-1" id="apiKeyDisplay"></p>
        <button type="button" id="resetKey" class="text-xs text-indigo-600 hover:underline mb-4">Trocar de chave</button>
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium">E-mail para receber o CSV</label>
            <input type="email" id="email" name="email" required placeholder="seumelhoremail@provedor.com"
              class="mt-1 w-full text-sm border border-gray-300 rounded-lg p-2 bg-white" />
          </div>
          <div>
            <label for="files" class="block text-sm font-medium">Arquivos XML (até 5)</label>
            <input type="file" id="files" name="files" accept=".xml" multiple required
              class="mt-1 w-full text-sm border border-gray-300 rounded-lg p-2 bg-white" />
          </div>
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg shadow transition">
            Enviar & Converter
          </button>
        </form>
        <div id="message" class="text-sm text-center mt-4"></div>
      </div>

    </div>
  </main>

  <script>
    // Aponte para a URL da sua API.
    //   - Local com serverless-offline: http://localhost:3000
    //   - AWS dev/prod: a URL exibida no deploy
    const API_BASE_URL = "http://localhost:3000";
    const API_KEY_STORAGE = "notacsv_api_key";

    const signupSection = document.getElementById('signupSection');
    const uploadSection = document.getElementById('uploadSection');
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');
    const uploadForm = document.getElementById('uploadForm');
    const message = document.getElementById('message');
    const apiKeyDisplay = document.getElementById('apiKeyDisplay');
    const resetKey = document.getElementById('resetKey');

    function showUpload(apiKey) {
      apiKeyDisplay.textContent = apiKey;
      signupSection.classList.add('hidden');
      uploadSection.classList.remove('hidden');
    }

    function showSignup() {
      uploadSection.classList.add('hidden');
      signupSection.classList.remove('hidden');
    }

    // Restaura a sessão se já houver chave salva.
    const storedKey = localStorage.getItem(API_KEY_STORAGE);
    if (storedKey) showUpload(storedKey);

    resetKey.addEventListener('click', () => {
      localStorage.removeItem(API_KEY_STORAGE);
      showSignup();
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = signupForm.signupEmail.value;
      signupMessage.textContent = "Gerando chave...";
      signupMessage.className = "text-sm text-center mt-4 text-gray-600";

      try {
        const res = await fetch(`${API_BASE_URL}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) throw new Error(data.message || "Erro ao gerar a chave.");

        localStorage.setItem(API_KEY_STORAGE, data.apiKey);
        signupMessage.textContent = "";
        showUpload(data.apiKey);
      } catch (err) {
        signupMessage.textContent = err.message || "Erro ao gerar a chave. Tente novamente.";
        signupMessage.className = "text-sm text-center mt-4 text-red-600";
      }
    });

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        showSignup();
        return;
      }

      const email = uploadForm.email.value;
      const files = uploadForm.files.files;

      if (!email || files.length === 0 || files.length > 5) {
        message.textContent = "Insira um e-mail válido e até 5 arquivos XML.";
        message.className = "text-sm text-center mt-4 text-red-600";
        return;
      }

      const formData = new FormData();
      formData.append("email", email);
      for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
      }

      message.textContent = "Enviando arquivos...";
      message.className = "text-sm text-center mt-4 text-gray-600";

      try {
        const res = await fetch(`${API_BASE_URL}/upload`, {
          method: "POST",
          headers: { "x-api-key": apiKey },
          body: formData
        });
        const data = await res.json().catch(() => ({}));

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem(API_KEY_STORAGE);
          message.textContent = "Sua chave de API é inválida. Gere uma nova.";
          message.className = "text-sm text-center mt-4 text-red-600";
          showSignup();
          return;
        }
        if (res.status === 429) {
          message.textContent = "Você atingiu o limite mensal de envios.";
          message.className = "text-sm text-center mt-4 text-red-600";
          return;
        }
        if (!res.ok) throw new Error(data.message);

        message.textContent = "Sucesso! Você receberá o CSV por e-mail.";
        message.className = "text-sm text-center mt-4 text-green-600";
        uploadForm.reset();
      } catch (err) {
        message.textContent = "Erro ao enviar. Tente novamente.";
        message.className = "text-sm text-center mt-4 text-red-600";
      }
    });
  </script>
</body>
</html>
